name: Dreame Local Cloud — X40 Pro Ultra
version: "0.9.1-x40.11"
slug: dreame_local_cloud
description: Upstream-based X40 Pro Ultra compatibility trial for the existing HACS integration.
url: https://github.com/hongho55/Dreame-local/tree/main
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: false
ports:
  19973/tcp: 19973
  13267/tcp: 13267
  8443/tcp: 8443
  19980/tcp: 19980
ports_description:
  19973/tcp: 로봇 MQTT (로봇 DNS를 이 서버로 연결)
  13267/tcp: 로봇 클라우드 API (기존 리전 DNS 연결 유지)
  8443/tcp: HTTPS 지도·로그 업로드
  19980/tcp: HTTP 지도·로그 업로드 (로봇에서 HA로, 내부망 전용)
options:
  device_did: ""
  device_uid: ""
  device_model: dreame.vacuum.r2401
  region: cn
  device_name: X40 Pro Ultra
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  lan_ip: ""
  upload_host: ""
  device_ip: ""
  mac: ""
  broker_port: 19973
  web_port: 8099
  upload_port: 8443
  upload_http_port: 19980
  upload_scheme: http
  api_port: 13267
  log_level: info
schema:
  device_did: str
  device_uid: str
  device_model: str
  region: str
  device_name: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  discovery_prefix: str
  lan_ip: str
  upload_host: str
  device_ip: str
  mac: str
  broker_port: port
  web_port: port
  upload_port: port
  upload_http_port: port?
  upload_scheme: list(http|https)?
  api_port: port
  log_level: list(debug|info|warning|error)
